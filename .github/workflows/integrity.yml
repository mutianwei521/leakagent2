name: integrity
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q agents schemas tools anomaly_sim data eval tests run_diagnosis.py reproduce_all.py
      - name: Integrity lint (no hard-coded metrics)
        run: python tests/integrity_lint.py
